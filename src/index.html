<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="/run/group-channels/" />
  <title>Group Channels</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           var(--hub-bg, #f9fafb);
      --card:         var(--hub-surface, #ffffff);
      --border:       var(--hub-border, #e5e7eb);
      --border-mid:   var(--hub-border, #d1d5db);
      --text:         var(--hub-text, #000000);
      --muted:        var(--hub-text-muted, #6b7280);
      --accent:       var(--hub-primary, #111827);
      --accent-hover: var(--hub-primary-hover, #374151);
      --radius:       var(--hub-radius, 0.5rem);
      --font:         var(--hub-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      --font-size:    var(--hub-font-size, 15px);
      --red:          #dc2626;
      --red-light:    #fee2e2;
      --green:        #059669;
      --amber:        #d97706;
      --sidebar-w:    220px;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      font-size: var(--font-size);
      line-height: 1.5;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Layout ── */
    .app { display: flex; height: 100vh; }

    /* ── Sidebar ── */
    .sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      background: var(--card);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 14px 12px 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sidebar-title {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--muted);
      flex: 1;
    }

    .btn-icon {
      width: 26px; height: 26px;
      display: inline-flex; align-items: center; justify-content: center;
      border: none; background: transparent; cursor: pointer;
      border-radius: 6px; color: var(--muted); font-size: 1rem;
      transition: background .12s, color .12s;
    }
    .btn-icon:hover { background: var(--bg); color: var(--text); }

    .sidebar-search {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-search input {
      width: 100%;
      padding: 5px 8px;
      border: 1px solid var(--border-mid);
      border-radius: 6px;
      font-size: 0.8rem;
      background: var(--bg);
      color: var(--text);
      outline: none;
    }
    .sidebar-search input:focus { border-color: var(--accent); }

    .channel-list { flex: 1; overflow-y: auto; padding: 6px 0; }

    .channel-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 0.875rem;
      border-radius: 0;
      transition: background .1s;
      position: relative;
    }
    .channel-item:hover { background: var(--bg); }
    .channel-item.active { background: var(--bg); font-weight: 600; color: var(--accent); }
    .channel-item.archived-ch { opacity: .55; }

    .ch-hash { color: var(--muted); font-size: 0.95rem; flex-shrink: 0; }
    .ch-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ch-unread {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    .sidebar-section-label {
      padding: 10px 12px 4px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
    }

    .toggle-archived {
      padding: 8px 12px;
      font-size: 0.78rem;
      color: var(--muted);
      cursor: pointer;
      border: none;
      background: none;
      text-align: left;
      width: 100%;
      transition: color .12s;
    }
    .toggle-archived:hover { color: var(--text); }

    /* ── Main pane ── */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    .channel-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--card);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .channel-header-hash { font-size: 1.1rem; color: var(--muted); }
    .channel-header-name { font-weight: 700; font-size: 1rem; }
    .channel-header-desc { font-size: 0.8rem; color: var(--muted); margin-left: 4px; }
    .channel-header-actions { margin-left: auto; display: flex; gap: 6px; align-items: center; }

    .badge-archived {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--amber);
      background: #fef3c7;
      border-radius: 4px;
      padding: 2px 6px;
    }

    /* ── Messages ── */
    .messages-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .date-sep {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 14px 0 10px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
    }
    .date-sep::before, .date-sep::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .msg-group { margin-bottom: 2px; }

    .msg-row {
      display: flex;
      gap: 10px;
      padding: 3px 0;
      align-items: flex-start;
    }
    .msg-row:hover { background: var(--bg); border-radius: 6px; }

    .avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.8rem; font-weight: 700; color: #fff;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .avatar-spacer { width: 32px; flex-shrink: 0; }

    /* Collapsed follow-up messages sit tight under the first of a run. */
    .msg-grouped { padding-top: 0; }

    /* Clock time shown in the avatar gutter for grouped messages. */
    .gutter-time {
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      padding-top: 3px;
      overflow: visible;
    }
    .gutter-time span {
      font-size: 0.62rem;
      line-height: 1.4;
      color: var(--muted);
      white-space: nowrap;
    }
    /* Desktop: reveal the grouped time only when the row is hovered. */
    @media (hover: hover) {
      .gutter-time span { opacity: 0; transition: opacity 0.08s ease; }
      .msg-row:hover .gutter-time span { opacity: 1; }
    }
    /* Touch: nothing to hover, so keep it faintly visible (Telegram-style). */
    @media (hover: none) {
      .gutter-time span { opacity: 0.55; }
    }

    .msg-meta {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 1px;
    }
    .msg-meta strong { color: var(--text); font-size: 0.875rem; margin-right: 6px; }

    .msg-body {
      font-size: 0.9rem;
      line-height: 1.55;
      word-break: break-word;
    }
    .msg-body .mention {
      color: var(--accent);
      font-weight: 600;
      background: color-mix(in srgb, var(--accent) 10%, transparent);
      border-radius: 3px;
      padding: 0 2px;
    }

    .msg-files { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .msg-file-img {
      max-width: 260px; max-height: 180px;
      border-radius: 8px; border: 1px solid var(--border);
      object-fit: cover; cursor: pointer;
    }
    .msg-file-link {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 0.8rem; padding: 4px 8px;
      border: 1px solid var(--border-mid); border-radius: 6px;
      color: var(--accent); text-decoration: none;
      background: var(--bg);
    }
    .msg-file-link:hover { border-color: var(--accent); }

    .load-more-btn {
      align-self: center;
      margin: 8px 0 4px;
      font-size: 0.8rem;
      color: var(--muted);
      background: none;
      border: 1px solid var(--border-mid);
      border-radius: 6px;
      padding: 4px 14px;
      cursor: pointer;
    }
    .load-more-btn:hover { color: var(--text); border-color: var(--accent); }

    /* ── Composer ── */
    .composer {
      padding: 10px 16px 12px;
      border-top: 1px solid var(--border);
      background: var(--card);
      flex-shrink: 0;
      position: relative;
    }

    .composer-box {
      border: 1px solid var(--border-mid);
      border-radius: 10px;
      background: var(--bg);
      transition: border-color .15s;
    }
    .composer-box:focus-within { border-color: var(--accent); }

    .composer textarea {
      width: 100%;
      padding: 10px 12px 6px;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      font-family: var(--font);
      font-size: 0.9rem;
      color: var(--text);
      line-height: 1.5;
      min-height: 42px;
      max-height: 160px;
      overflow-y: auto;
    }

    .composer-actions {
      display: flex;
      align-items: center;
      padding: 4px 8px 6px;
      gap: 6px;
    }

    .composer-pending-files {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 6px 10px 0;
    }
    .pending-file-chip {
      display: flex; align-items: center; gap: 5px;
      font-size: 0.78rem; padding: 3px 8px;
      background: var(--bg); border: 1px solid var(--border-mid);
      border-radius: 20px; color: var(--muted);
    }
    .pending-file-chip button {
      background: none; border: none; cursor: pointer;
      color: var(--muted); font-size: 0.85rem; line-height: 1;
      padding: 0 2px;
    }
    .pending-file-chip button:hover { color: var(--red); }

    .btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 7px 14px; border-radius: 7px; font-size: 0.85rem;
      font-weight: 600; cursor: pointer; border: none;
      transition: opacity .15s, background .15s;
    }
    .btn:disabled { opacity: .45; cursor: default; }
    .btn-primary { background: var(--accent); color: var(--hub-primary-fg, #fff); }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-ghost {
      background: transparent; color: var(--muted);
      border: 1.5px solid var(--border-mid);
    }
    .btn-ghost:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .btn-danger { background: var(--red); color: white; }
    .btn-danger:hover:not(:disabled) { opacity: .88; }
    .btn-sm { padding: 5px 11px; font-size: 0.8rem; }

    .spacer { flex: 1; }

    /* ── Mention autocomplete ── */
    .mention-popup {
      position: absolute;
      bottom: calc(100% + 4px);
      left: 16px;
      right: 16px;
      max-height: 180px;
      overflow-y: auto;
      background: var(--card);
      border: 1px solid var(--border-mid);
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,.12);
      z-index: 100;
    }
    .mention-item {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 12px; cursor: pointer; font-size: 0.875rem;
    }
    .mention-item:hover, .mention-item.highlighted { background: var(--bg); }
    .mention-item .avatar { width: 24px; height: 24px; font-size: 0.7rem; }

    /* ── Empty states ── */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      gap: 8px;
      padding: 32px;
      text-align: center;
    }
    .empty-icon { font-size: 2.5rem; }
    .empty-title { font-size: 1rem; font-weight: 600; color: var(--text); }
    .empty-sub { font-size: 0.85rem; }

    .no-channel {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      gap: 10px;
    }
    .no-channel-icon { font-size: 3rem; }

    /* ── Search results ── */
    .search-results {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
    }
    .search-result-item {
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .search-result-item:hover { background: var(--bg); border-radius: 6px; padding-left: 8px; }
    .search-result-ch { font-size: 0.75rem; color: var(--muted); margin-bottom: 2px; }
    .search-result-body { font-size: 0.875rem; }
    .search-result-body mark { background: #fef08a; border-radius: 2px; padding: 0 1px; }
    .search-result-meta { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }

    /* ── Modal ── */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.4);
      display: flex; align-items: center; justify-content: center;
      z-index: 200;
      padding: 16px;
    }
    .modal {
      background: var(--card);
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 8px 32px rgba(0,0,0,.18);
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 16px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 5px; color: var(--muted); }
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%; padding: 8px 10px;
      border: 1px solid var(--border-mid);
      border-radius: 7px;
      font-size: 0.9rem;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      outline: none;
    }
    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus { border-color: var(--accent); }
    .form-group textarea { resize: vertical; min-height: 64px; }
    .slug-preview { font-size: 0.78rem; color: var(--muted); margin-top: 4px; }
    .slug-preview span { color: var(--accent); font-weight: 600; }

    .group-checkboxes { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
    .group-checkbox { display: flex; align-items: center; gap: 8px; font-size: 0.875rem; cursor: pointer; }
    .group-checkbox input { width: 15px; height: 15px; cursor: pointer; }

    .member-picker {
      max-height: 160px;
      overflow-y: auto;
      border: 1px solid var(--border-mid);
      border-radius: 7px;
      margin-top: 6px;
    }
    .member-pick-item {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 10px; cursor: pointer;
      font-size: 0.875rem;
    }
    .member-pick-item:hover { background: var(--bg); }
    .member-pick-item input { width: 15px; height: 15px; cursor: pointer; }
    .member-pick-item .avatar { width: 22px; height: 22px; font-size: 0.65rem; }

    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

    /* ── Manage channel dropdown ── */
    .ch-menu {
      position: absolute;
      top: calc(100% + 4px);
      right: 0;
      background: var(--card);
      border: 1px solid var(--border-mid);
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,.12);
      z-index: 150;
      min-width: 160px;
      overflow: hidden;
    }
    .ch-menu-item {
      display: block; width: 100%;
      padding: 9px 14px;
      font-size: 0.875rem;
      text-align: left;
      background: none; border: none; cursor: pointer;
      color: var(--text);
    }
    .ch-menu-item:hover { background: var(--bg); }
    .ch-menu-item.danger { color: var(--red); }
    .ch-menu-anchor { position: relative; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-mid); border-radius: 99px; }
  </style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Channels</span>

      <button class="btn-icon" id="new-channel-btn" data-testid="new-channel" title="New channel" style="display:none">＋</button>

      <div style="color:var(--muted);font-size:.9rem">Select a channel to get started</div>
    </div>
  </main>
</div>

<script type="module">
import { memberColor, initial, esc, formatRelativeDate, formatClockTime,
         canManageChannels, canSeeChannel, canPostInChannel,
         slugify, resolveChannelMemberIds, renderBody,
         extractMentionedIds, dateLabel, isSameDay, shouldGroupMessages, searchableFields } from "./logic.js";
import { hubAlert, createFilesHelper, searchMatch } from "/hub-sdk.js";

// ── Globals ───────────────────────────────────────────────────────────────────
const CONTEXT      = window.__CONTEXT_URL  ?? "";
const DB           = window.__DB_URL       ?? "";
const STORE        = window.__STORE_URL    ?? "";
const FILES_URL    = window.__FILES_URL    ?? "";
const APP_ID       = window.__APP_ID       ?? "group-channels";
const ME           = window.__CURRENT_MEMBER ?? null;
const IS_ADMIN     = window.__IS_ADMIN ?? false;
const ADMIN_CONFIG = window.__ADMIN_CONFIG_URL ?? "";
const NOTIFY_SUBS  = window.__NOTIFY_SUBSCRIBERS_URL ?? "";
const DEBUG_GROUPS = (() => {
  try {
    return new URLSearchParams(window.location.search).has("debugGroups") ||
      window.localStorage?.getItem("groupChannelsDebug") === "1";
  } catch { return false; }
})();

const files = createFilesHelper(FILES_URL);

function debugGroups(message, details = {}) {
  if (DEBUG_GROUPS) console.debug("[group-channels:groups]", message, details);
}

// ── State ─────────────────────────────────────────────────────────────────────
let members          = [];
let groups           = [];           // family.groups: [{ id, name, memberIds }]
let leadershipGroupId = "";          // settings.leadership_group_id (trust root)
let channels         = [];
let channelMembersMap = {}; // channelId → string[]
let subscriptions    = new Set(); // channel ids the current member subscribes to
let lastReadMap      = {};  // channelId → ISO timestamp (when I last opened it)
let latestMsgMap     = {};  // channelId → ISO timestamp of the channel's newest message
let currentChannelId = null;
let messages         = [];
let messageOffset    = 0;
const PAGE           = 50;
let showArchived     = false;
let searchQuery      = "";
let pendingFiles     = []; // { file, id?, url?, uploading }
let mentionQuery     = null;
let mentionCursorPos = 0;
let highlightedMention = 0;
let modalEl          = null;
let chMenuEl         = null;

// ── DB helper ─────────────────────────────────────────────────────────────────
async function db(sql, params = []) {
  if (!DB) return { rows: [] };
  const res = await fetch(DB, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sql, params }),
  });
  return res.json();
}

// Atomic multi-statement form of /api/db, capped at 25 statements server-side.
// Rebuilding a custom channel's roster is a DELETE followed by one INSERT per
// member; issued separately, anything that interrupted the sequence left the
// channel with NO members — and `messages` is channel_scoped on that table, so
// every message in it became unreadable to everyone but leadership.
const MAX_BATCH = 25;

async function dbBatch(statements) {
  if (!DB || !statements.length) return [];
  const res = await fetch(DB, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ statements }),
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok || body.error) throw new Error(body?.error ?? `batch failed (${res.status})`);
  return body.results ?? [];
}

// Chunks past the cap lose atomicity at the chunk boundary, so the DELETE rides
// in the FIRST chunk with as many INSERTs as fit. A channel of more than 24
// custom members can still end up partially rebuilt if a later chunk fails, but
// it can no longer end up empty.
async function dbBatchAll(statements) {
  for (let i = 0; i < statements.length; i += MAX_BATCH) {
    await dbBatch(statements.slice(i, i + MAX_BATCH));
  }
}

// ── Data loaders ─────────────────────────────────────────────────────────────
async function loadMembers() {
  if (!CONTEXT) {
    members = [
      { id: "m1", name: "Alex Johnson", role: "admin" },
      { id: "m2", name: "Jordan Lee",   role: "officer" },
      { id: "m3", name: "Sam Rivera",   role: "member" },
      { id: "m4", name: "Taylor Kim",   role: "pledge" },
    ];
    groups = [
      { id: "g-leadership", name: "Leadership", memberIds: ["m1", "m2"] },
      { id: "g-finance", name: "Finance", memberIds: ["m1", "m2"] },
    ];
    return;
  }
  try {
    const res = await fetch(`${CONTEXT}?keys=family.members,family.groups`);
    debugGroups("context response", { ok: res.ok, status: res.status, url: CONTEXT });
    const data = await res.json();
    debugGroups("context payload", {
      keys: Object.keys(data ?? {}),
      hasGroupsKey: Object.prototype.hasOwnProperty.call(data ?? {}, "family.groups"),
      groupCount: Array.isArray(data?.["family.groups"]) ? data["family.groups"].length : null,
      memberCount: Array.isArray(data?.["family.members"]) ? data["family.members"].length : null,
    });
    members = data["family.members"] ?? [];
    groups  = data["family.groups"]  ?? [];
  } catch (err) {
    debugGroups("context load failed", { error: err instanceof Error ? err.message : String(err) });
    members = [];
    groups = [];
  }
}

// `settings` is the app_config table: everyone may read the leadership_group_id
// pointer, but it is writable ONLY through the admin-gated /api/admin-config
// endpoint (manifest admin_config). This is the trust root for "who is leadership".
async function loadSettings() {
  if (!DB) { leadershipGroupId = ""; return; }
  try {
    const res = await db(
      `SELECT value AS v FROM app_group_channels__settings WHERE key = 'leadership_group_id' LIMIT 1`
    );
    leadershipGroupId = res?.rows?.[0]?.v ?? "";
  } catch { leadershipGroupId = ""; }
}

// Newest message timestamp per channel, for unread indicators. The channel_scoped
// policy on `messages` means this only returns channels the caller can see, so no
// restricted channel leaks in. GROUP BY parses fine through the policy rewriter.
async function loadChannelLatest() {
  if (!DB) return;
  const res = await db(
    `SELECT channel_id, MAX(created_at) AS last_at
     FROM app_group_channels__messages
     GROUP BY channel_id`
  );
  latestMsgMap = {};
  for (const r of (res.rows ?? [])) latestMsgMap[r.channel_id] = r.last_at;
}

async function loadMessages(channelId, offset = 0) {
  if (!DB) return demoDemoMessages(channelId);

  // LIMIT/OFFSET are inlined as integers: the hub's row-policy SQL rewriter
  // (node-sql-parser) cannot parse parameterized LIMIT/OFFSET on a
  // policy-governed table, so `LIMIT ? OFFSET ?` would be rejected outright.
  const lim = Math.max(1, Math.floor(PAGE));
  const off = Math.max(0, Math.floor(Number(offset) || 0));
  const res = await db(
    `SELECT * FROM app_group_channels__messages
     WHERE channel_id = ?
     ORDER BY created_at ASC, id ASC
     LIMIT ${lim} OFFSET ${off}`,
    [channelId]
  );
  const msgs = (res.rows ?? []).map(m => ({ ...m, attachments: [] }));
  if (!msgs.length) return msgs;

  // Attachments are fetched in a SEPARATE query. `message_files` is its own
  // policy-governed table (channel_scoped, like messages) so its rows follow
  // channel visibility — but the rewriter mis-binds parameters when two
  // governed tables appear in one statement, so we never JOIN them.
  const byId = {};
  for (const m of msgs) byId[m.id] = m;
  const ph = msgs.map(() => "?").join(",");
  const fRes = await db(
    `SELECT id, message_id, file_id, file_name, mime_type, size_bytes
     FROM app_group_channels__message_files
     WHERE message_id IN (${ph})`,
    msgs.map(m => m.id)
  );
  for (const f of (fRes.rows ?? [])) {
    byId[f.message_id]?.attachments.push({
      id: f.id, file_id: f.file_id, file_name: f.file_name,
      mime_type: f.mime_type, size_bytes: f.size_bytes,
    });
  }
  return msgs;
}

async function searchMessages(query) {
  // `body` is encrypted at rest (not in db_plaintext_columns), so a SQL
  // `WHERE lower(body) LIKE ?` compares ciphertext and matches nothing. Instead
  // fetch recent messages — the channel_scoped policy already restricts these to
  // channels the caller may see — and filter on the DECRYPTED body client-side.
  if (!query.trim()) return [];
  const res = await db(
    `SELECT id, channel_id, author_name, body, created_at
     FROM app_group_channels__messages
     ORDER BY created_at DESC
     LIMIT 500`
  );
  return (res.rows ?? [])
    .filter(m => searchMatch(query, searchableFields(m)))
    .slice(0, 50);
}

// ── Notifications ─────────────────────────────────────────────────────────────
// Fan out a new-message notification through the hub's subscription endpoint.
// The hub notifies channel followers (channel_subscriptions is owner_only, so the
// client can't read who they are) plus any @mentioned members in `mentionIds`,
// re-checks that each recipient may still see the channel, and pushes only to them —
// so we never blast the household-wide "all" audience and never leak previews.
async function notifyChannel(channelId, title, body, mentionIds) {
  if (!NOTIFY_SUBS) return;
  const res = await fetch(NOTIFY_SUBS, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      topic_id: channelId,
      title,
      body,
      url: `/run/${APP_ID}?channelId=${channelId}`,
      also_notify: Array.isArray(mentionIds) ? mentionIds : [],
    }),
  });
  if (!res.ok) {
    let message = "Notify subscribers failed";
    try { message = (await res.json()).error ?? message; } catch {}
    throw new Error(message);
  }
}

// ── Channel visibility filter ─────────────────────────────────────────────────
function visibleChannels() {
  return channels.filter(ch => {
    if (!showArchived && ch.archived_at) return false;
    return canSeeChannel(ME ?? { id: "", role: "member" }, ch, channelMembersMap[ch.id] ?? [], groups);
  });
}

// ── Mark last-read ────────────────────────────────────────────────────────────
async function markRead(channelId) {
  if (!ME || !DB) return;
  const now = new Date().toISOString();
  lastReadMap[channelId] = now;
  // Opening a channel reads it up to "now", so it can never show as unread while open.
  latestMsgMap[channelId] = latestMsgMap[channelId] && latestMsgMap[channelId] > now
    ? latestMsgMap[channelId] : now;
  await db(
    `INSERT INTO app_group_channels__member_last_read (channel_id, member_id, last_read_at)
     VALUES (?, ?, ?)
     ON CONFLICT (channel_id, member_id) DO UPDATE SET last_read_at = EXCLUDED.last_read_at`,
    [channelId, ME.id, now]
  );
}

function hasUnread(ch) {
  if (!ME) return false;
  if (ch.id === currentChannelId) return false;       // actively viewing → read
  const latest = latestMsgMap[ch.id];
  if (!latest) return false;                           // no messages in the channel
  const lastRead = lastReadMap[ch.id];
  return !lastRead || latest > lastRead;               // ISO timestamps sort lexicographically
}

function renderMessages() {
  const wrap = document.getElementById("messages-wrap");
  if (!wrap) return;

  if (!messages.length) {
    wrap.innerHTML = `<div class="empty-state">
      <div class="empty-icon">#️⃣</div>
      <div class="empty-title">No messages yet</div>
      <div class="empty-sub">Be the first to say something!</div>
    </div>`;
    return;
  }

  let html = "";

  if (messageOffset > 0) {
    html += `<button class="load-more-btn" onclick="window.loadMoreMessages()">Load earlier messages</button>`;
  }

  let lastDate = null;
  let prevMsg = null;
  for (const msg of messages) {
    const msgDate = msg.created_at.slice(0, 10);
    let startsNewDay = false;
    if (msgDate !== lastDate) {
      html += `<div class="date-sep">${dateLabel(msg.created_at)}</div>`;
      lastDate = msgDate;
      startsNewDay = true;
    }
    // Never collapse the first message under a date separator into the prior day.
    const grouped = !startsNewDay && shouldGroupMessages(prevMsg, msg);
    html += messageHtml(msg, grouped);
    prevMsg = msg;
  }

  wrap.innerHTML = html;
  wrap.scrollTop = wrap.scrollHeight;
}

function messageHtml(msg, grouped = false) {
  const color = memberColor(msg.author_id);
  const initials = initial(msg.author_name);
  const bodyHtml = renderBody(msg.body, members);
  const timeStr = formatClockTime(msg.created_at);
  const gutterTime = formatClockTime(msg.created_at, true);

  let filesHtml = "";
  if (msg.attachments?.length) {
    filesHtml = `<div class="msg-files">` +
      msg.attachments.map(f => {
        if (f.mime_type.startsWith("image/")) {
          return `<img class="msg-file-img" src="${files.url(f.file_id)}" alt="${esc(f.file_name)}" loading="lazy" />`;
        }
        return `<a class="msg-file-link" href="${files.url(f.file_id)}" target="_blank" rel="noopener">📄 ${esc(f.file_name)}</a>`;
      }).join("") +
    `</div>`;
  }

  const leftCol = grouped
    ? `<div class="avatar-spacer gutter-time"><span>${esc(gutterTime)}</span></div>`
    : `<div class="avatar" style="background:${color}">${esc(initials)}</div>`;

  const header = grouped
    ? ""
    : `<div class="msg-meta">
          <strong>${esc(msg.author_name)}</strong>
          <span>${esc(timeStr)}</span>
        </div>`;

  return `
    <div class="msg-row${grouped ? " msg-grouped" : ""}">
      ${leftCol}
      <div style="flex:1;min-width:0">
        ${header}
        <div class="msg-body">${bodyHtml}</div>
        ${filesHtml}
      </div>
    </div>`;
}

async function renderSearchPane(main) {
  const results = await searchMessages(searchQuery);

  const chMap = {};
  for (const ch of channels) chMap[ch.id] = ch;

  let html = `
    <div class="channel-header">
      <span style="font-weight:700">Search results for "${esc(searchQuery)}"</span>
      <div class="channel-header-actions">
        <button class="btn btn-ghost btn-sm" onclick="window.clearSearch()">✕ Clear</button>
      </div>
    </div>
    <div class="search-results">`;

  if (!results.length) {
    html += `<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-title">No results</div><div class="empty-sub">Try different keywords</div></div>`;
  } else {
    // The matcher requires every token to hit some field, so highlight per
    // token — the query as one literal string usually isn't in the body.
    const tokens = searchQuery.split(/\s+/).filter(Boolean);
    for (const r of results) {
      const ch = chMap[r.channel_id];
      if (!ch) continue;
      let highlighted = esc(r.body);
      for (const token of tokens) {
        highlighted = highlighted.replace(
          new RegExp(esc(token).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"),
          m => `<mark>${m}</mark>`
        );
      }
      html += `
        <div class="search-result-item" onclick="window.jumpToMessage('${esc(r.channel_id)}')">
          <div class="search-result-ch">#${esc(ch.name)}</div>
          <div class="search-result-body">${highlighted}</div>
          <div class="search-result-meta">${esc(r.author_name)} · ${formatRelativeDate(r.created_at)}</div>
        </div>`;
    }
  }

  html += `</div>`;
  main.innerHTML = html;
}

window.refreshCurrentChannel = async function() {
  if (!currentChannelId) return;
  const btn = document.getElementById("refresh-channel-btn");
  if (btn) { btn.disabled = true; btn.textContent = "↻ Refreshing"; }

    messageOffset = 0;
    renderSidebar();
    renderMain();
    await markRead(currentChannelId);
  } catch (err) {
    if (btn) { btn.disabled = false; btn.textContent = "↻ Refresh"; }

// Follow / unfollow a channel. channel_subscriptions is owner_only, so a member
// can only ever write their OWN row (the policy forces member_id to the caller).
// Following just opts you into the hub's notify-subscribers fan-out for this channel.
window.toggleFollow = async function(channelId) {
  if (!ME || !DB) return;
  const wasFollowing = subscriptions.has(channelId);
  if (wasFollowing) subscriptions.delete(channelId); else subscriptions.add(channelId);
  renderMain(); // reflect the bell immediately (optimistic)
  try {
    const r = wasFollowing
      ? await db(`DELETE FROM app_group_channels__channel_subscriptions WHERE channel_id = ? AND member_id = ?`, [channelId, ME.id])
      : await db(`INSERT INTO app_group_channels__channel_subscriptions (channel_id, member_id) VALUES (?, ?) ON CONFLICT DO NOTHING`, [channelId, ME.id]);
    if (r && r.error) throw new Error(r.error);
  } catch {
    if (wasFollowing) subscriptions.add(channelId); else subscriptions.delete(channelId);
    renderMain();
  }
};

// ── Composer ──────────────────────────────────────────────────────────────────
window.composerInput = function(e) {
  const ta = e.target;
  ta.style.height = "auto";
  ta.style.height = Math.min(ta.scrollHeight, 160) + "px";
  updateMentionPopup(ta);
};

window.composerKeydown = function(e) {
  const popup = document.getElementById("mention-popup");
  if (popup && popup.style.display !== "none") {
    const items = popup.querySelectorAll(".mention-item");
    if (e.key === "ArrowDown") { e.preventDefault(); highlightedMention = Math.min(highlightedMention + 1, items.length - 1); refreshMentionHighlight(items); return; }
    if (e.key === "ArrowUp")   { e.preventDefault(); highlightedMention = Math.max(highlightedMention - 1, 0); refreshMentionHighlight(items); return; }
    if (e.key === "Enter" || e.key === "Tab") {
      e.preventDefault();
      const active = items[highlightedMention];
      if (active) active.click();
      return;
    }
    if (e.key === "Escape") { closeMentionPopup(); return; }
  }
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    window.sendMessage();
  }
};

function updateMentionPopup(ta) {
  const text = ta.value.slice(0, ta.selectionStart);
  // Match @<anything> at the end of the typed text (including spaces for multi-word names)
  const match = text.match(/@([^@]*)$/);
  if (!match) { closeMentionPopup(); return; }

  const query = match[1].toLowerCase();
  mentionCursorPos = ta.selectionStart - match[0].length;

  const ch = channels.find(c => c.id === currentChannelId);
  if (!ch) { closeMentionPopup(); return; }
  const memberIds = resolveChannelMemberIds(ch, members, channelMembersMap[ch.id] ?? [], groups);
  const memberIdSet = new Set(memberIds);
  const channelMembers = members.filter(m => memberIdSet.has(m.id));

  const filtered = channelMembers.filter(m => m.name.toLowerCase().includes(query));
  if (!filtered.length) { closeMentionPopup(); return; }

  highlightedMention = 0;
  const popup = document.getElementById("mention-popup");
  popup.style.display = "block";
  // Pass the name via a data-* attribute, not interpolated into the onclick JS
  // string: esc() does not escape single quotes, so a name like O'Brien would
  // break out of onclick="...('${name}')" (inline-handler injection). data-name
  // is an HTML attribute context where esc()'s &quot; encoding is sufficient.
  popup.innerHTML = filtered.map((m, i) => `
    <div class="mention-item ${i === 0 ? "highlighted" : ""}" data-name="${esc(m.name)}" onclick="window.insertMention(this.dataset.name)">
      <div class="avatar" style="background:${memberColor(m.id)}">${esc(initial(m.name))}</div>
      ${esc(m.name)}
    </div>`).join("");
}

function refreshMentionHighlight(items) {
  items.forEach((el, i) => el.classList.toggle("highlighted", i === highlightedMention));
}

function closeMentionPopup() {
  const p = document.getElementById("mention-popup");
  if (p) p.style.display = "none";
  mentionQuery = null;
}

window.insertMention = function(name) {
  const ta = document.getElementById("composer-ta");
  if (!ta) return;
  const before = ta.value.slice(0, mentionCursorPos);
  const after  = ta.value.slice(ta.selectionStart);
  ta.value = `${before}@${name} ${after}`;
  ta.focus();
  const pos = mentionCursorPos + name.length + 2;
  ta.setSelectionRange(pos, pos);
  closeMentionPopup();
};

// ── File uploads ──────────────────────────────────────────────────────────────
window.onFileSelected = async function(e) {
  const selected = Array.from(e.target.files);
  e.target.value = "";
  for (const file of selected) {
    const entry = { tempId: crypto.randomUUID(), file, uploading: true, id: null, url: null, name: file.name, mime_type: file.type };
    pendingFiles.push(entry);
    renderPendingFiles();
    try {
      const { id, url } = await files.upload(file);
      entry.id = id;
      entry.url = url;
      entry.uploading = false;
    } catch (err) {
      pendingFiles = pendingFiles.filter(f => f.tempId !== entry.tempId);
      hubAlert(`Upload failed: ${err.message}`);
    }
    renderPendingFiles();
  }
};

function renderPendingFiles() {
  const el = document.getElementById("pending-files-list");
  if (!el) return;
  el.innerHTML = pendingFiles.map(f => `
    <div class="pending-file-chip">
      ${f.uploading ? "⏳" : "📎"} ${esc(f.name)}
      ${!f.uploading ? `<button onclick="window.removePendingFile('${f.tempId}')">✕</button>` : ""}
    </div>`).join("");
}

window.removePendingFile = async function(tempId) {
  const f = pendingFiles.find(x => x.tempId === tempId);
  if (f?.id) await files.delete(f.id).catch(() => {});
  pendingFiles = pendingFiles.filter(x => x.tempId !== tempId);
  renderPendingFiles();
};

// ── Send ──────────────────────────────────────────────────────────────────────
window.sendMessage = async function() {
  if (!ME) return;
  const ta = document.getElementById("composer-ta");
  if (!ta) return;
  const body = ta.value.trim();
  if (!body && !pendingFiles.length) return;
  if (pendingFiles.some(f => f.uploading)) { hubAlert("Still uploading files, please wait."); return; }

  const msgId = crypto.randomUUID();
  const now   = new Date().toISOString();
  const filesToAttach = [...pendingFiles];

  // Optimistic: show message immediately, clear composer
  messages = [...messages, {
    id: msgId, channel_id: currentChannelId,
    author_id: ME.id, author_name: ME.name,
    body, created_at: now,
    attachments: filesToAttach.map(f => ({
      id: f.id, file_id: f.id, file_name: f.name,
      mime_type: f.mime_type, size_bytes: f.file?.size ?? 0,
    })),
  }];
  ta.value = "";
  ta.style.height = "auto";
  pendingFiles = [];
  renderPendingFiles();
  renderMessages();

  try {
    await db(
      `INSERT INTO app_group_channels__messages (id, channel_id, author_id, author_name, body, created_at)
       VALUES (?, ?, ?, ?, ?, ?)`,
      [msgId, currentChannelId, ME.id, ME.name, body, now]
    );

    // File inserts in parallel
    await Promise.all(filesToAttach.map(f =>
      db(
        `INSERT INTO app_group_channels__message_files (id, message_id, channel_id, author_id, file_id, file_name, mime_type, size_bytes, created_at)
         VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?)`,
        [crypto.randomUUID(), msgId, currentChannelId, ME.id, f.id, f.name, f.mime_type, f.file?.size ?? 0, now]
      )
    ));

    // Notify fire-and-forget — doesn't affect sender's UI
    const ch = channels.find(c => c.id === currentChannelId);
    if (ch) {
      // The hub fans out to channel followers + these @mentioned ids, applying
      // channel-visibility eligibility server-side (channel_subscriptions is
      // owner_only, so followers can't be resolved or fanned out from the client).
      const mentionIds = [...new Set(extractMentionedIds(body, members))].filter(id => id !== ME.id);
      notifyChannel(currentChannelId, `#${ch.name}`, `${ME.name}: ${body.slice(0, 80)}`, mentionIds)
        .catch(err => console.warn("[group-channels] notification failed", err));
    }

    // Reload for authoritative server state, then mark read
    messages = await loadMessages(currentChannelId, 0);
    messageOffset = 0;
    renderMessages();
    markRead(currentChannelId).catch(() => {});
  } catch(e) {
    // Revert optimistic message and restore composer
    messages = messages.filter(m => m.id !== msgId);
    ta.value = body;
    pendingFiles = filesToAttach;
    renderPendingFiles();
    renderMessages();
    throw e;
  }
};

// ── Channel management ─────────────────────────────────────────────────────────
window.toggleChMenu = function(e) {
  e.stopPropagation();
  if (chMenuEl) { closeChMenu(); return; }

  const anchor = e.currentTarget.closest(".ch-menu-anchor");
  const ch = channels.find(c => c.id === currentChannelId);
  if (!ch) return;

  chMenuEl = document.createElement("div");
  chMenuEl.className = "ch-menu";
  chMenuEl.innerHTML = `
    ${!ch.archived_at ? `<button class="ch-menu-item" onclick="window.openEditChannel('${esc(ch.id)}')">Edit channel</button>` : ""}
    ${!ch.is_system && !ch.archived_at ? `<button class="ch-menu-item danger" onclick="window.archiveChannel('${esc(ch.id)}')">Archive channel</button>` : ""}
    ${ch.archived_at ? `<button class="ch-menu-item" onclick="window.unarchiveChannel('${esc(ch.id)}')">Unarchive channel</button>` : ""}
  `;
  anchor.appendChild(chMenuEl);
  setTimeout(() => document.addEventListener("click", closeChMenu, { once: true }), 0);
};

function closeChMenu() {
  chMenuEl?.remove();
  chMenuEl = null;
}

window.openNewChannel = function() {
  openChannelModal(null);
};

window.openEditChannel = function(id) {
  closeChMenu();
  const ch = channels.find(c => c.id === id);
  if (ch) openChannelModal(ch);
};

function openChannelModal(ch) {
  const editing = !!ch;
  const selectedGroupIds = ch ? JSON.parse(ch.membership_roles || "[]") : [];
  const isGroup = ch?.membership_type === "group";
  const isCustom = ch?.membership_type === "custom";
  const customIds = ch ? (channelMembersMap[ch.id] ?? []) : [];

  const groupOptions = groups.map(g => `
    <label class="group-checkbox">
      <input type="checkbox" name="group" value="${esc(g.id)}" ${selectedGroupIds.includes(g.id) ? "checked" : ""} />
      ${esc(g.name)}
    </label>`).join("");

  const memberOptions = members.map(m => `
    <label class="member-pick-item">
      <input type="checkbox" value="${esc(m.id)}" ${customIds.includes(m.id) ? "checked" : ""} />
      <div class="avatar" style="background:${memberColor(m.id)}">${esc(initial(m.name))}</div>
      ${esc(m.name)} <span style="font-size:.75rem;color:var(--muted);margin-left:4px">${esc(m.role)}</span>
    </label>`).join("");

  openModal(`
    <h2>${editing ? "Edit channel" : "New channel"}</h2>
    <div class="form-group">
      <label>Name</label>
      <input id="f-name" type="text" value="${editing ? esc(ch.name) : ""}" placeholder="e.g. Finance" oninput="window.onChannelNameInput()" maxlength="50" />
      <div class="slug-preview">Slug: <span id="slug-preview">#${editing ? esc(ch.slug) : ""}</span></div>
    </div>
    <div class="form-group">
      <label>Description <span style="font-weight:400;color:var(--muted)">(optional)</span></label>
      <textarea id="f-desc" rows="2" maxlength="200">${editing ? esc(ch.description) : ""}</textarea>
    </div>
    <div class="form-group">
      <label>Membership</label>
      <select id="f-membership" onchange="window.onMembershipChange()">
        <option value="all"    ${!isGroup && !isCustom ? "selected" : ""}>All members</option>
        <option value="group"  ${isGroup  ? "selected" : ""}>Group-based</option>
        <option value="custom" ${isCustom ? "selected" : ""}>Hand-picked</option>
      </select>
    </div>
    <div id="f-groups-wrap" style="${isGroup ? "" : "display:none"}">
      <div class="form-group">
        <label>Groups</label>
        <div class="group-checkboxes">
          ${groupOptions || `<div class="slug-preview">No groups exist yet — create one under <strong>Settings → Groups</strong> first.</div>`}
        </div>
      </div>
    </div>
    <div id="f-custom-wrap" style="${isCustom ? "" : "display:none"}">
      <div class="form-group">
        <label>Members</label>
        <div class="member-picker">${memberOptions}</div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="window.closeModal()">Cancel</button>
      <button class="btn btn-primary" id="f-submit" onclick="window.submitChannel('${editing ? esc(ch.id) : ""}')">
        ${editing ? "Save" : "Create"}
      </button>
    </div>
  `);

  if (!editing) window.onChannelNameInput();
}

window.onChannelNameInput = function() {
  const name = document.getElementById("f-name")?.value ?? "";
  const preview = document.getElementById("slug-preview");
  if (preview) preview.textContent = "#" + (slugify(name) || "channel-name");
};

window.onMembershipChange = function() {
  const val = document.getElementById("f-membership")?.value;
  document.getElementById("f-groups-wrap").style.display = val === "group"  ? "" : "none";
  document.getElementById("f-custom-wrap").style.display = val === "custom" ? "" : "none";
};

window.submitChannel = async function(existingId) {
  const name = document.getElementById("f-name").value.trim();
  if (!name) { document.getElementById("f-name").focus(); return; }

  const slug = slugify(name);
  if (!slug) { hubAlert("Invalid channel name."); return; }

  const membershipType = document.getElementById("f-membership").value;
  const desc = document.getElementById("f-desc").value.trim();

  let membershipRoles = "[]";
  let customMemberIds = [];

  if (membershipType === "group") {
    const checked = [...document.querySelectorAll('input[name="group"]:checked')].map(el => el.value);
    if (!checked.length) { hubAlert("Select at least one group."); return; }
    membershipRoles = JSON.stringify(checked);
  }
  if (membershipType === "custom") {
    customMemberIds = [...document.querySelectorAll(".member-picker input:checked")].map(el => el.value);
    if (!customMemberIds.length) { hubAlert("Select at least one member."); return; }
  }

  const btn = document.getElementById("f-submit");
  if (btn) { btn.disabled = true; btn.textContent = existingId ? "Saving…" : "Creating…"; }

  try {
    if (existingId) {
      await db(
        `UPDATE app_group_channels__channels SET name = ?, description = ?, membership_type = ?, membership_roles = ? WHERE id = ?`,
        [name, desc, membershipType, membershipRoles, existingId]
      );
      if (membershipType === "custom") {
        await dbBatchAll([
          { sql: `DELETE FROM app_group_channels__channel_members WHERE channel_id = ?`, params: [existingId] },
          ...customMemberIds.map(mid => ({
            sql: `INSERT INTO app_group_channels__channel_members (channel_id, member_id) VALUES (?, ?) ON CONFLICT DO NOTHING`,
            params: [existingId, mid],
          })),
        ]);
      } else {
        await db(`DELETE FROM app_group_channels__channel_members WHERE channel_id = ?`, [existingId]);
      }
    } else {
      const id = crypto.randomUUID();
      const now = new Date().toISOString();
      await db(
        `INSERT INTO app_group_channels__channels (id, name, slug, description, membership_type, membership_roles, is_system, created_by, created_at)
         VALUES (?, ?, ?, ?, ?, ?, 0, ?, ?)`,
        [id, name, slug, desc, membershipType, membershipRoles, ME?.id ?? "", now]
      );
      if (membershipType === "custom") {
        await Promise.all(customMemberIds.map(mid =>
          db(
            `INSERT INTO app_group_channels__channel_members (channel_id, member_id) VALUES (?, ?)`,
            [id, mid]
          )
        ));
      }
    }

    closeModal();
    await loadChannels();
    renderSidebar();
  } catch(e) {
    if (btn) { btn.disabled = false; btn.textContent = existingId ? "Save" : "Create"; }
    throw e;
  }
};

window.archiveChannel = async function(id) {
  closeChMenu();
  const { hubConfirm } = await import("/hub-sdk.js");
  const ok = await hubConfirm({
    message: "Archive this channel?",
    description: "The channel will become read-only and hidden from the default view. This cannot be undone from the app.",
    confirmLabel: "Archive",
    destructive: true,
  });
  if (!ok) return;

  await db(
    `UPDATE app_group_channels__channels SET archived_at = ? WHERE id = ?`,
    [new Date().toISOString(), id]
  );
  await loadChannels();
  if (currentChannelId === id) currentChannelId = null;
  renderSidebar();
  renderMain();
};

window.unarchiveChannel = async function(id) {
  closeChMenu();
  await db(
    `UPDATE app_group_channels__channels SET archived_at = NULL WHERE id = ?`,
    [id]
  );
  await loadChannels();
  renderSidebar();
  renderMain();
};

// ── Channel manager settings (hub-admin only) ─────────────────────────────────
// Appointing the manager group is the trust root for who may manage channels.
// It is written ONLY through the admin-gated /api/admin-config endpoint; the
// `app_config` row policy rejects any app-originated SQL write to the settings
// table, closing the bootstrap hole where any adult could crown themselves.
window.openSettings = function() {
  if (!IS_ADMIN) return;
  const options = [
    `<option value="" ${!leadershipGroupId ? "selected" : ""}>— None (channel management disabled) —</option>`,
    ...groups.map(g =>
      `<option value="${esc(g.id)}" ${leadershipGroupId === g.id ? "selected" : ""}>${esc(g.name)}</option>`
    ),
  ].join("");
  openModal(`
    <h2>Channel manager settings</h2>
    <div class="form-group">
      <label>Channel manager group</label>
      <select id="f-leadership">${options}</select>
      <div class="slug-preview" style="margin-top:8px">
        Members of this group may create, edit, and archive channels and manage
        membership. Until a group is set, channel management is disabled for everyone.
      </div>
      ${!groups.length ? `<div class="slug-preview" style="margin-top:6px">No groups exist yet — create one under <strong>Settings → Groups</strong> first.</div>` : ""}
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="window.closeModal()">Cancel</button>
      <button class="btn btn-primary" id="f-save-leadership" onclick="window.saveLeadershipGroup()">Save</button>
    </div>
  `);
};

window.saveLeadershipGroup = async function() {
  const sel = document.getElementById("f-leadership");
  if (!sel) return;
  const groupId = sel.value;
  const prev = leadershipGroupId;
  const btn = document.getElementById("f-save-leadership");
  if (btn) { btn.disabled = true; btn.textContent = "Saving…"; }
  try {
    const res = await fetch(ADMIN_CONFIG, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key: "leadership_group_id", value: groupId }),
    });
    if (!res.ok) {
      let m = "Save failed";
      try { m = (await res.json()).error ?? m; } catch {}
      throw new Error(m);
    }
    leadershipGroupId = groupId;
    closeModal();
    renderSidebar();
    renderMain();
  } catch (e) {
    leadershipGroupId = prev;
    if (btn) { btn.disabled = false; btn.textContent = "Save"; }
    hubAlert(e.message ?? "Save failed");
  }
};

// ── Search ─────────────────────────────────────────────────────────────────────
let searchDebounce = null;
document.getElementById("search-input").addEventListener("input", e => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => {
    searchQuery = e.target.value.trim();
    renderMain();
  }, 300);
});

// ── Modal ─────────────────────────────────────────────────────────────────────
function openModal(html) {
  closeModal();
  modalEl = document.createElement("div");
  modalEl.className = "modal-backdrop";
  modalEl.innerHTML = `<div class="modal">${html}</div>`;
  modalEl.addEventListener("click", e => { if (e.target === modalEl) closeModal(); });
  document.body.appendChild(modalEl);
}
window.closeModal = function() { modalEl?.remove(); modalEl = null; };

// ── New channel button ────────────────────────────────────────────────────────
document.getElementById("new-channel-btn").addEventListener("click", () => window.openNewChannel());
document.getElementById("settings-btn").addEventListener("click", () => window.openSettings());

// ── Deep link ─────────────────────────────────────────────────────────────────
function handleDeepLink() {
  const params = new URLSearchParams(window.location.search);
  const channelId = params.get("channelId");
  if (channelId) window.openChannel(channelId);
}

// ── Bootstrap ─────────────────────────────────────────────────────────────────
(async () => {
  await Promise.all([loadMembers(), loadSettings(), loadChannels(), loadSubscriptions(), loadLastRead(), loadChannelLatest()]);
  renderSidebar();
  handleDeepLink();
  if (!currentChannelId) renderMain();
})();
</script>
