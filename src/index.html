<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="/run/group-channels/" />
  <title>Group Channels</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           var(--hub-bg, #f9fafb);
      --card:         var(--hub-surface, #ffffff);
      --border:       var(--hub-border, #e5e7eb);
      --border-mid:   var(--hub-border, #d1d5db);
      --text:         var(--hub-text, #111827);
      --muted:        var(--hub-text-muted, #6b7280);
      --accent:       var(--hub-primary, #111827);
      --accent-hover: var(--hub-primary-hover, #374151);
      --radius:       var(--hub-radius, 0.5rem);
      --font:         var(--hub-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      --font-size:    var(--hub-font-size, 15px);
      --red:          #dc2626;
      --red-light:    #fee2e2;
      --green:        #059669;
      --amber:        #d97706;
      --sidebar-w:    220px;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      font-size: var(--font-size);
      line-height: 1.5;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Layout ── */
    .app { display: flex; height: 100vh; }

    /* ── Sidebar ── */
    .sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      background: var(--card);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 14px 12px 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sidebar-title {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--muted);
      flex: 1;
    }

    .btn-icon {
      width: 26px; height: 26px;
      display: inline-flex; align-items: center; justify-content: center;
      border: none; background: transparent; cursor: pointer;
      border-radius: 6px; color: var(--muted); font-size: 1rem;
      transition: background .12s, color .12s;
    }
    .btn-icon:hover { background: var(--bg); color: var(--text); }

    .sidebar-search {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-search input {
      width: 100%;
      padding: 5px 8px;
      border: 1px solid var(--border-mid);
      border-radius: 6px;
      font-size: 0.8rem;
      background: var(--bg);
      color: var(--text);
      outline: none;
    }
    .sidebar-search input:focus { border-color: var(--accent); }

    .channel-list { flex: 1; overflow-y: auto; padding: 6px 0; }

    .channel-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 0.875rem;
      border-radius: 0;
      transition: background .1s;
      position: relative;
    }
    .channel-item:hover { background: var(--bg); }
    .channel-item.active { background: var(--bg); font-weight: 600; color: var(--accent); }
    .channel-item.archived-ch { opacity: .55; }

    .ch-hash { color: var(--muted); font-size: 0.95rem; flex-shrink: 0; }
    .ch-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ch-unread {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    .sidebar-section-label {
      padding: 10px 12px 4px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
    }

    .toggle-archived {
      padding: 8px 12px;
      font-size: 0.78rem;
      color: var(--muted);
      cursor: pointer;
      border: none;
      background: none;
      text-align: left;
      width: 100%;
      transition: color .12s;
    }
    .toggle-archived:hover { color: var(--text); }

    /* ── Main pane ── */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    .channel-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--card);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .channel-header-hash { font-size: 1.1rem; color: var(--muted); }
    .channel-header-name { font-weight: 700; font-size: 1rem; }
    .channel-header-desc { font-size: 0.8rem; color: var(--muted); margin-left: 4px; }
    .channel-header-actions { margin-left: auto; display: flex; gap: 6px; align-items: center; }

    .badge-archived {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--amber);
      background: #fef3c7;
      border-radius: 4px;
      padding: 2px 6px;
    }

    /* ── Messages ── */
    .messages-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .date-sep {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 14px 0 10px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
    }
    .date-sep::before, .date-sep::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .msg-group { margin-bottom: 2px; }

    .msg-row {
      display: flex;
      gap: 10px;
      padding: 3px 0;
      align-items: flex-start;
    }
    .msg-row:hover { background: var(--bg); border-radius: 6px; }

    .avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.8rem; font-weight: 700; color: #fff;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .avatar-spacer { width: 32px; flex-shrink: 0; }

    .msg-meta {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 1px;
    }
    .msg-meta strong { color: var(--text); font-size: 0.875rem; margin-right: 6px; }

    .msg-body {
      font-size: 0.9rem;
      line-height: 1.55;
      word-break: break-word;
    }
    .msg-body .mention {
      color: var(--accent);
      font-weight: 600;
      background: color-mix(in srgb, var(--accent) 10%, transparent);
      border-radius: 3px;
      padding: 0 2px;
    }

    .msg-files { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .msg-file-img {
      max-width: 260px; max-height: 180px;
      border-radius: 8px; border: 1px solid var(--border);
      object-fit: cover; cursor: pointer;
    }
    .msg-file-link {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 0.8rem; padding: 4px 8px;
      border: 1px solid var(--border-mid); border-radius: 6px;
      color: var(--accent); text-decoration: none;
      background: var(--bg);
    }
    .msg-file-link:hover { border-color: var(--accent); }

    .load-more-btn {
      align-self: center;
      margin: 8px 0 4px;
      font-size: 0.8rem;
      color: var(--muted);
      background: none;
      border: 1px solid var(--border-mid);
      border-radius: 6px;
      padding: 4px 14px;
      cursor: pointer;
    }
    .load-more-btn:hover { color: var(--text); border-color: var(--accent); }

    /* ── Composer ── */
    .composer {
      padding: 10px 16px 12px;
      border-top: 1px solid var(--border);
      background: var(--card);
      flex-shrink: 0;
      position: relative;
    }

    .composer-box {
      border: 1px solid var(--border-mid);
      border-radius: 10px;
      background: var(--bg);
      transition: border-color .15s;
    }
    .composer-box:focus-within { border-color: var(--accent); }

    .composer textarea {
      width: 100%;
      padding: 10px 12px 6px;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      font-family: var(--font);
      font-size: 0.9rem;
      color: var(--text);
      line-height: 1.5;
      min-height: 42px;
      max-height: 160px;
      overflow-y: auto;
    }

    .composer-actions {
      display: flex;
      align-items: center;
      padding: 4px 8px 6px;
      gap: 6px;
    }

    .composer-pending-files {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 6px 10px 0;
    }
    .pending-file-chip {
      display: flex; align-items: center; gap: 5px;
      font-size: 0.78rem; padding: 3px 8px;
      background: var(--bg); border: 1px solid var(--border-mid);
      border-radius: 20px; color: var(--muted);
    }
    .pending-file-chip button {
      background: none; border: none; cursor: pointer;
      color: var(--muted); font-size: 0.85rem; line-height: 1;
      padding: 0 2px;
    }
    .pending-file-chip button:hover { color: var(--red); }

    .btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 7px 14px; border-radius: 7px; font-size: 0.85rem;
      font-weight: 600; cursor: pointer; border: none;
      transition: opacity .15s, background .15s;
    }
    .btn:disabled { opacity: .45; cursor: default; }
    .btn-primary { background: var(--accent); color: var(--hub-primary-fg, #fff); }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-ghost {
      background: transparent; color: var(--muted);
      border: 1.5px solid var(--border-mid);
    }
    .btn-ghost:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .btn-danger { background: var(--red); color: white; }
    .btn-danger:hover:not(:disabled) { opacity: .88; }
    .btn-sm { padding: 5px 11px; font-size: 0.8rem; }

    .spacer { flex: 1; }

    /* ── Mention autocomplete ── */
    .mention-popup {
      position: absolute;
      bottom: calc(100% + 4px);
      left: 16px;
      right: 16px;
      max-height: 180px;
      overflow-y: auto;
      background: var(--card);
      border: 1px solid var(--border-mid);
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,.12);
      z-index: 100;
    }
    .mention-item {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 12px; cursor: pointer; font-size: 0.875rem;
    }
    .mention-item:hover, .mention-item.highlighted { background: var(--bg); }
    .mention-item .avatar { width: 24px; height: 24px; font-size: 0.7rem; }

    /* ── Empty states ── */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      gap: 8px;
      padding: 32px;
      text-align: center;
    }
    .empty-icon { font-size: 2.5rem; }
    .empty-title { font-size: 1rem; font-weight: 600; color: var(--text); }
    .empty-sub { font-size: 0.85rem; }

    .no-channel {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      gap: 10px;
    }
    .no-channel-icon { font-size: 3rem; }

    /* ── Search results ── */
    .search-results {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
    }
    .search-result-item {
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .search-result-item:hover { background: var(--bg); border-radius: 6px; padding-left: 8px; }
    .search-result-ch { font-size: 0.75rem; color: var(--muted); margin-bottom: 2px; }
    .search-result-body { font-size: 0.875rem; }
    .search-result-body mark { background: #fef08a; border-radius: 2px; padding: 0 1px; }
    .search-result-meta { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }

    /* ── Modal ── */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.4);
      display: flex; align-items: center; justify-content: center;
      z-index: 200;
      padding: 16px;
    }
    .modal {
      background: var(--card);
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 8px 32px rgba(0,0,0,.18);
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 16px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 5px; color: var(--muted); }
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%; padding: 8px 10px;
      border: 1px solid var(--border-mid);
      border-radius: 7px;
      font-size: 0.9rem;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      outline: none;
    }
    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus { border-color: var(--accent); }
    .form-group textarea { resize: vertical; min-height: 64px; }
    .slug-preview { font-size: 0.78rem; color: var(--muted); margin-top: 4px; }
    .slug-preview span { color: var(--accent); font-weight: 600; }

    .role-checkboxes { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
    .role-checkbox { display: flex; align-items: center; gap: 8px; font-size: 0.875rem; cursor: pointer; }
    .role-checkbox input { width: 15px; height: 15px; cursor: pointer; }

    .member-picker {
      max-height: 160px;
      overflow-y: auto;
      border: 1px solid var(--border-mid);
      border-radius: 7px;
      margin-top: 6px;
    }
    .member-pick-item {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 10px; cursor: pointer;
      font-size: 0.875rem;
    }
    .member-pick-item:hover { background: var(--bg); }
    .member-pick-item input { width: 15px; height: 15px; cursor: pointer; }
    .member-pick-item .avatar { width: 22px; height: 22px; font-size: 0.65rem; }

    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

    /* ── Manage channel dropdown ── */
    .ch-menu {
      position: absolute;
      top: calc(100% + 4px);
      right: 0;
      background: var(--card);
      border: 1px solid var(--border-mid);
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,.12);
      z-index: 150;
      min-width: 160px;
      overflow: hidden;
    }
    .ch-menu-item {
      display: block; width: 100%;
      padding: 9px 14px;
      font-size: 0.875rem;
      text-align: left;
      background: none; border: none; cursor: pointer;
      color: var(--text);
    }
    .ch-menu-item:hover { background: var(--bg); }
    .ch-menu-item.danger { color: var(--red); }
    .ch-menu-anchor { position: relative; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-mid); border-radius: 99px; }
  </style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Channels</span>
      <button class="btn-icon" id="new-channel-btn" title="New channel" style="display:none">＋</button>
    </div>
    <div class="sidebar-search">
      <input type="search" id="search-input" placeholder="Search messages…" autocomplete="off" />
    </div>
    <div class="channel-list" id="channel-list"></div>
  </aside>

  <!-- Main -->
  <main class="main" id="main-pane">
    <div class="no-channel">
      <div class="no-channel-icon">#️⃣</div>
      <div style="color:var(--muted);font-size:.9rem">Select a channel to get started</div>
    </div>
  </main>
</div>

<script type="module">
import { memberColor, initial, esc, formatRelativeDate,
         canManageChannels, canSeeChannel, canPostInChannel,
         slugify, resolveChannelMemberIds, renderBody,
         extractMentionedIds, dateLabel, isSameDay } from "./logic.js";
import { createFilesHelper } from "/hub-sdk.js";

// ── Globals ───────────────────────────────────────────────────────────────────
const CONTEXT   = window.__CONTEXT_URL  ?? "";
const DB        = window.__DB_URL       ?? "";
const STORE     = window.__STORE_URL    ?? "";
const FILES_URL = window.__FILES_URL    ?? "";
const APP_ID    = window.__APP_ID       ?? "group-channels";
const ME        = window.__CURRENT_MEMBER ?? null;

const files = createFilesHelper(FILES_URL);

// ── State ─────────────────────────────────────────────────────────────────────
let members          = [];
let channels         = [];
let channelMembersMap = {}; // channelId → string[]
let subscriptions    = new Set(); // channel ids the current member subscribes to
let lastReadMap      = {};  // channelId → ISO timestamp
let currentChannelId = null;
let messages         = [];
let messageOffset    = 0;
const PAGE           = 50;
let showArchived     = false;
let searchQuery      = "";
let pendingFiles     = []; // { file, id?, url?, uploading }
let mentionQuery     = null;
let mentionCursorPos = 0;
let highlightedMention = 0;
let modalEl          = null;
let chMenuEl         = null;

// ── DB helper ─────────────────────────────────────────────────────────────────
async function db(sql, params = []) {
  if (!DB) return { rows: [] };
  const res = await fetch(DB, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sql, params }),
  });
  return res.json();
}

// ── Data loaders ─────────────────────────────────────────────────────────────
async function loadMembers() {
  if (!CONTEXT) {
    members = [
      { id: "m1", name: "Alex Johnson", role: "admin" },
      { id: "m2", name: "Jordan Lee",   role: "officer" },
      { id: "m3", name: "Sam Rivera",   role: "member" },
      { id: "m4", name: "Taylor Kim",   role: "pledge" },
    ];
    return;
  }
  try {
    const res = await fetch(`${CONTEXT}?keys=family.members`);
    members = ((await res.json())["family.members"]) ?? [];
  } catch { members = []; }
}

async function loadChannels() {
  const [chRes, cmRes] = await Promise.all([
    db(`SELECT * FROM channels WHERE household_id = current_setting('app.household_id', true)::uuid ORDER BY is_system DESC, name`),
    db(`SELECT * FROM channel_members WHERE household_id = current_setting('app.household_id', true)::uuid`),
  ]);

  channels = chRes.rows ?? [];
  channelMembersMap = {};
  for (const cm of (cmRes.rows ?? [])) {
    if (!channelMembersMap[cm.channel_id]) channelMembersMap[cm.channel_id] = [];
    channelMembersMap[cm.channel_id].push(cm.member_id);
  }

  if (!DB) seedDemoData();
}

function seedDemoData() {
  channels = [
    { id: "ch1", name: "House-Wide",  slug: "house-wide",  membership_type: "all",   membership_roles: "[]", is_system: 1, description: "All members", archived_at: null, created_at: new Date().toISOString(), created_by: "system" },
    { id: "ch2", name: "Leadership",  slug: "leadership",  membership_type: "role",  membership_roles: '["admin","officer"]', is_system: 1, description: "Officers only", archived_at: null, created_at: new Date().toISOString(), created_by: "system" },
    { id: "ch3", name: "Finance",     slug: "finance",     membership_type: "role",  membership_roles: '["admin","officer"]', is_system: 0, description: "Budget & dues", archived_at: null, created_at: new Date().toISOString(), created_by: "m1" },
  ];
  channelMembersMap = {};
}

async function loadSubscriptions() {
  if (!ME) return;
  const res = await db(
    `SELECT channel_id FROM channel_subscriptions WHERE household_id = current_setting('app.household_id', true)::uuid AND member_id = ?`,
    [ME.id]
  );
  subscriptions = new Set((res.rows ?? []).map(r => r.channel_id));
}

async function loadLastRead() {
  if (!ME) return;
  const res = await db(
    `SELECT channel_id, last_read_at FROM member_last_read WHERE household_id = current_setting('app.household_id', true)::uuid AND member_id = ?`,
    [ME.id]
  );
  lastReadMap = {};
  for (const r of (res.rows ?? [])) lastReadMap[r.channel_id] = r.last_read_at;
}

async function loadMessages(channelId, offset = 0) {
  const res = await db(
    `SELECT m.*, f.id AS f_id, f.file_name, f.mime_type, f.size_bytes, f.file_id
     FROM messages m
     LEFT JOIN message_files f ON f.message_id = m.id AND f.household_id = m.household_id
     WHERE m.channel_id = ? AND m.household_id = current_setting('app.household_id', true)::uuid
     ORDER BY m.created_at ASC, m.id ASC
     LIMIT ? OFFSET ?`,
    [channelId, PAGE, offset]
  );

  // Merge file rows into messages
  const msgMap = {};
  for (const row of (res.rows ?? [])) {
    if (!msgMap[row.id]) {
      msgMap[row.id] = { ...row, attachments: [] };
      delete msgMap[row.id].f_id;
    }
    if (row.f_id) {
      msgMap[row.id].attachments.push({
        id: row.f_id, file_id: row.file_id, file_name: row.file_name,
        mime_type: row.mime_type, size_bytes: row.size_bytes,
      });
    }
  }
  const rows = Object.values(msgMap);

  if (!DB) return demoDemoMessages(channelId);
  return rows;
}

function demoDemoMessages(channelId) {
  if (channelId !== "ch1") return [];
  const now = new Date();
  const h = (n) => new Date(now - n * 60000).toISOString();
  return [
    { id: "dm1", channel_id: "ch1", author_id: "m2", author_name: "Jordan Lee",  body: "Hey everyone, chapter meeting moved to Thursday at 7pm!", created_at: h(120), attachments: [] },
    { id: "dm2", channel_id: "ch1", author_id: "m3", author_name: "Sam Rivera",  body: "@Jordan Lee sounds good, I'll let the pledges know", created_at: h(110), attachments: [] },
    { id: "dm3", channel_id: "ch1", author_id: "m1", author_name: "Alex Johnson", body: "Thanks Jordan. Also reminder: dues are due by end of month.", created_at: h(60),  attachments: [] },

async function searchMessages(query) {
  const q = `%${query}%`;
  const res = await db(
    `SELECT m.id, m.channel_id, m.author_name, m.body, m.created_at
     FROM messages m
     WHERE m.household_id = current_setting('app.household_id', true)::uuid
       AND lower(m.body) LIKE lower(?)
     ORDER BY m.created_at DESC
     LIMIT 50`,
    [q]
  );
  return res.rows ?? [];
}

async function notify(title, body) {
  await fetch("/api/notifications/send", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ title, body, url: `/run/${APP_ID}?channelId=${currentChannelId}` }),
  }).catch(() => {});
}

// ── Channel visibility filter ─────────────────────────────────────────────────
function visibleChannels() {
  return channels.filter(ch => {
    if (!showArchived && ch.archived_at) return false;
    return canSeeChannel(ME ?? { id: "", role: "member" }, ch, channelMembersMap[ch.id] ?? []);
  });
}

// ── Mark last-read ────────────────────────────────────────────────────────────
async function markRead(channelId) {
  if (!ME || !DB) return;
  const now = new Date().toISOString();
  lastReadMap[channelId] = now;
  await db(
    `INSERT INTO member_last_read (household_id, channel_id, member_id, last_read_at)
     VALUES (current_setting('app.household_id', true)::uuid, ?, ?, ?)
     ON CONFLICT (household_id, channel_id, member_id) DO UPDATE SET last_read_at = EXCLUDED.last_read_at`,
    [channelId, ME.id, now]
  );
}

function hasUnread(ch) {
  if (!ME) return false;
  if (!messages.length && ch.id !== currentChannelId) return false;
  const lastRead = lastReadMap[ch.id];
  if (!lastRead) return true; // never opened
  // We can't know from cached state alone — rely on a dedicated last-msg check per channel.
  // For simplicity, mark unread only if channel has received a message after lastRead.
  return false; // full unread tracking requires per-channel latest-msg query; skip for now
}

function renderMessages() {

    return;
  }

  let html = "";

  if (messageOffset > 0) {

  for (const msg of messages) {
    const msgDate = msg.created_at.slice(0, 10);
    if (msgDate !== lastDate) {
      html += `<div class="date-sep">${dateLabel(msg.created_at)}</div>`;

  const color = memberColor(msg.author_id);
  const initials = initial(msg.author_name);

  const timeStr = formatRelativeDate(msg.created_at);

  let filesHtml = "";
  if (msg.attachments?.length) {
    filesHtml = `<div class="msg-files">` +
      msg.attachments.map(f => {
        if (f.mime_type.startsWith("image/")) {
          return `<img class="msg-file-img" src="${files.url(f.file_id)}" alt="${esc(f.file_name)}" loading="lazy" />`;
        }
        return `<a class="msg-file-link" href="${files.url(f.file_id)}" target="_blank" rel="noopener">📄 ${esc(f.file_name)}</a>`;
      }).join("") +
    `</div>`;

  return `
    <div class="msg-row">
      <div class="avatar" style="background:${color}">${esc(initials)}</div>
      <div style="flex:1;min-width:0">
        <div class="msg-meta">

          <span>${esc(timeStr)}</span>
        </div>

}

async function renderSearchPane(main) {
  const results = await searchMessages(searchQuery);

  const chMap = {};
  for (const ch of channels) chMap[ch.id] = ch;

  let html = `
    <div class="channel-header">
      <span style="font-weight:700">Search results for "${esc(searchQuery)}"</span>
      <div class="channel-header-actions">
        <button class="btn btn-ghost btn-sm" onclick="window.clearSearch()">✕ Clear</button>
      </div>
    </div>
    <div class="search-results">`;

  if (!results.length) {
    html += `<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-title">No results</div><div class="empty-sub">Try different keywords</div></div>`;
  } else {
    const q = searchQuery.toLowerCase();
    for (const r of results) {
      const ch = chMap[r.channel_id];
      if (!ch) continue;
      const highlighted = esc(r.body).replace(
        new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"),
        m => `<mark>${m}</mark>`
      );
      html += `
        <div class="search-result-item" onclick="window.jumpToMessage('${esc(r.channel_id)}')">
          <div class="search-result-ch">#${esc(ch.name)}</div>
          <div class="search-result-body">${highlighted}</div>
          <div class="search-result-meta">${esc(r.author_name)} · ${formatRelativeDate(r.created_at)}</div>
        </div>`;
    }
  }

  html += `</div>`;
  main.innerHTML = html;
}

// ── Composer ──────────────────────────────────────────────────────────────────
window.composerInput = function(e) {
  const ta = e.target;
  ta.style.height = "auto";
  ta.style.height = Math.min(ta.scrollHeight, 160) + "px";
  updateMentionPopup(ta);
};

window.composerKeydown = function(e) {
  const popup = document.getElementById("mention-popup");
  if (popup && popup.style.display !== "none") {
    const items = popup.querySelectorAll(".mention-item");
    if (e.key === "ArrowDown") { e.preventDefault(); highlightedMention = Math.min(highlightedMention + 1, items.length - 1); refreshMentionHighlight(items); return; }
    if (e.key === "ArrowUp")   { e.preventDefault(); highlightedMention = Math.max(highlightedMention - 1, 0); refreshMentionHighlight(items); return; }
    if (e.key === "Enter" || e.key === "Tab") {
      e.preventDefault();
      const active = items[highlightedMention];
      if (active) active.click();
      return;
    }
    if (e.key === "Escape") { closeMentionPopup(); return; }
  }
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    window.sendMessage();
  }
};

function updateMentionPopup(ta) {
  const text = ta.value.slice(0, ta.selectionStart);
  // Match @<anything> at the end of the typed text (including spaces for multi-word names)
  const match = text.match(/@([^@]*)$/);
  if (!match) { closeMentionPopup(); return; }

  const query = match[1].toLowerCase();
  mentionCursorPos = ta.selectionStart - match[0].length;

  const ch = channels.find(c => c.id === currentChannelId);
  if (!ch) { closeMentionPopup(); return; }
  const memberIds = resolveChannelMemberIds(ch, members, channelMembersMap[ch.id] ?? []);
  const channelMembers = members.filter(m => memberIds.includes(m.id));

  const filtered = channelMembers.filter(m => m.name.toLowerCase().includes(query));
  if (!filtered.length) { closeMentionPopup(); return; }

  highlightedMention = 0;
  const popup = document.getElementById("mention-popup");
  popup.style.display = "block";
  popup.innerHTML = filtered.map((m, i) => `
    <div class="mention-item ${i === 0 ? "highlighted" : ""}" onclick="window.insertMention('${esc(m.name)}')">
      <div class="avatar" style="background:${memberColor(m.id)}">${esc(initial(m.name))}</div>
      ${esc(m.name)}
    </div>`).join("");
}

function refreshMentionHighlight(items) {
  items.forEach((el, i) => el.classList.toggle("highlighted", i === highlightedMention));
}

function closeMentionPopup() {
  const p = document.getElementById("mention-popup");
  if (p) p.style.display = "none";
  mentionQuery = null;
}

window.insertMention = function(name) {
  const ta = document.getElementById("composer-ta");
  if (!ta) return;
  const before = ta.value.slice(0, mentionCursorPos);
  const after  = ta.value.slice(ta.selectionStart);
  ta.value = `${before}@${name} ${after}`;
  ta.focus();
  const pos = mentionCursorPos + name.length + 2;
  ta.setSelectionRange(pos, pos);
  closeMentionPopup();
};

// ── File uploads ──────────────────────────────────────────────────────────────
window.onFileSelected = async function(e) {
  const selected = Array.from(e.target.files);
  e.target.value = "";
  for (const file of selected) {
    const entry = { tempId: crypto.randomUUID(), file, uploading: true, id: null, url: null, name: file.name, mime_type: file.type };
    pendingFiles.push(entry);
    renderPendingFiles();
    try {
      const { id, url } = await files.upload(file);
      entry.id = id;
      entry.url = url;
      entry.uploading = false;
    } catch (err) {
      pendingFiles = pendingFiles.filter(f => f.tempId !== entry.tempId);
      alert(`Upload failed: ${err.message}`);
    }
    renderPendingFiles();
  }
};

function renderPendingFiles() {
  const el = document.getElementById("pending-files-list");
  if (!el) return;
  el.innerHTML = pendingFiles.map(f => `
    <div class="pending-file-chip">
      ${f.uploading ? "⏳" : "📎"} ${esc(f.name)}
      ${!f.uploading ? `<button onclick="window.removePendingFile('${f.tempId}')">✕</button>` : ""}
    </div>`).join("");
}

window.removePendingFile = async function(tempId) {
  const f = pendingFiles.find(x => x.tempId === tempId);
  if (f?.id) await files.delete(f.id).catch(() => {});
  pendingFiles = pendingFiles.filter(x => x.tempId !== tempId);
  renderPendingFiles();
};

// ── Send ──────────────────────────────────────────────────────────────────────
window.sendMessage = async function() {
  if (!ME) return;
  const ta = document.getElementById("composer-ta");
  if (!ta) return;
  const body = ta.value.trim();
  if (!body && !pendingFiles.length) return;
  if (pendingFiles.some(f => f.uploading)) { alert("Still uploading files, please wait."); return; }

  const msgId = crypto.randomUUID();
  const now   = new Date().toISOString();
  const filesToAttach = [...pendingFiles];

  // Optimistic: show message immediately, clear composer
  messages = [...messages, {
    id: msgId, channel_id: currentChannelId,
    author_id: ME.id, author_name: ME.name,
    body, created_at: now,
    attachments: filesToAttach.map(f => ({
      id: f.id, file_id: f.id, file_name: f.name,
      mime_type: f.mime_type, size_bytes: f.file?.size ?? 0,
    })),
  }];
  ta.value = "";
  ta.style.height = "auto";
  pendingFiles = [];
  renderPendingFiles();
  renderMessages();

  try {
    await db(
      `INSERT INTO messages (household_id, id, channel_id, author_id, author_name, body, created_at)
       VALUES (current_setting('app.household_id', true)::uuid, ?, ?, ?, ?, ?, ?)`,
      [msgId, currentChannelId, ME.id, ME.name, body, now]
    );

    // File inserts in parallel
    await Promise.all(filesToAttach.map(f =>
      db(
        `INSERT INTO message_files (household_id, id, message_id, file_id, file_name, mime_type, size_bytes, created_at)
         VALUES (current_setting('app.household_id', true)::uuid, ?, ?, ?, ?, ?, ?, ?)`,
        [crypto.randomUUID(), msgId, f.id, f.name, f.mime_type, f.file?.size ?? 0, now]
      )
    ));

    // Notify fire-and-forget — doesn't affect sender's UI
    const ch = channels.find(c => c.id === currentChannelId);
    if (ch) {
      const notifyIds = new Set([
        ...extractMentionedIds(body, members),
        ...[...subscriptions].filter(sid => sid === currentChannelId),
      ]);
      if (notifyIds.size) notify(`#${ch.name}`, `${ME.name}: ${body.slice(0, 80)}`).catch(() => {});
    }

    // Reload for authoritative server state, then mark read
    messages = await loadMessages(currentChannelId, 0);
    messageOffset = 0;
    renderMessages();
    markRead(currentChannelId).catch(() => {});
  } catch(e) {
    // Revert optimistic message and restore composer
    messages = messages.filter(m => m.id !== msgId);
    ta.value = body;
    pendingFiles = filesToAttach;
    renderPendingFiles();
    renderMessages();
    throw e;
  }
};

  if (chMenuEl) { closeChMenu(); return; }

  const anchor = e.currentTarget.closest(".ch-menu-anchor");
  const ch = channels.find(c => c.id === currentChannelId);
  if (!ch) return;

  chMenuEl = document.createElement("div");
  chMenuEl.className = "ch-menu";
  chMenuEl.innerHTML = `
    ${!ch.archived_at ? `<button class="ch-menu-item" onclick="window.openEditChannel('${esc(ch.id)}')">Edit channel</button>` : ""}
    ${!ch.is_system && !ch.archived_at ? `<button class="ch-menu-item danger" onclick="window.archiveChannel('${esc(ch.id)}')">Archive channel</button>` : ""}
    ${ch.archived_at ? `<button class="ch-menu-item" onclick="window.unarchiveChannel('${esc(ch.id)}')">Unarchive channel</button>` : ""}
  `;
  anchor.appendChild(chMenuEl);
  setTimeout(() => document.addEventListener("click", closeChMenu, { once: true }), 0);
};

window.submitChannel = async function(existingId) {
  const name = document.getElementById("f-name").value.trim();
  if (!name) { document.getElementById("f-name").focus(); return; }

  const slug = slugify(name);
  if (!slug) { alert("Invalid channel name."); return; }

  const membershipType = document.getElementById("f-membership").value;
  const desc = document.getElementById("f-desc").value.trim();

  let membershipRoles = "[]";
  let customMemberIds = [];

  if (membershipType === "role") {
    const checked = [...document.querySelectorAll('input[name="role"]:checked')].map(el => el.value);
    if (!checked.length) { alert("Select at least one role."); return; }
    membershipRoles = JSON.stringify(checked);
  }
  if (membershipType === "custom") {
    customMemberIds = [...document.querySelectorAll(".member-picker input:checked")].map(el => el.value);
    if (!customMemberIds.length) { alert("Select at least one member."); return; }
  }

  const btn = document.getElementById("f-submit");
  if (btn) { btn.disabled = true; btn.textContent = existingId ? "Saving…" : "Creating…"; }

  try {
    if (existingId) {
      await db(
        `UPDATE channels SET name = ?, description = ?, membership_type = ?, membership_roles = ? WHERE id = ? AND household_id = current_setting('app.household_id', true)::uuid`,
        [name, desc, membershipType, membershipRoles, existingId]
      );
      if (membershipType === "custom") {
        await db(`DELETE FROM channel_members WHERE channel_id = ? AND household_id = current_setting('app.household_id', true)::uuid`, [existingId]);
        await Promise.all(customMemberIds.map(mid =>
          db(
            `INSERT INTO channel_members (household_id, channel_id, member_id) VALUES (current_setting('app.household_id', true)::uuid, ?, ?) ON CONFLICT DO NOTHING`,
            [existingId, mid]
          )
        ));
      } else {
        await db(`DELETE FROM channel_members WHERE channel_id = ? AND household_id = current_setting('app.household_id', true)::uuid`, [existingId]);
      }
    } else {
      const id = crypto.randomUUID();
      const now = new Date().toISOString();
      await db(
        `INSERT INTO channels (household_id, id, name, slug, description, membership_type, membership_roles, is_system, created_by, created_at)
         VALUES (current_setting('app.household_id', true)::uuid, ?, ?, ?, ?, ?, ?, 0, ?, ?)`,
        [id, name, slug, desc, membershipType, membershipRoles, ME?.id ?? "", now]
      );
      if (membershipType === "custom") {
        await Promise.all(customMemberIds.map(mid =>
          db(
            `INSERT INTO channel_members (household_id, channel_id, member_id) VALUES (current_setting('app.household_id', true)::uuid, ?, ?)`,
            [id, mid]
          )
        ));
      }
    }

    closeModal();
    await loadChannels();
    renderSidebar();
  } catch(e) {
    if (btn) { btn.disabled = false; btn.textContent = existingId ? "Save" : "Create"; }
    throw e;
  }
};

window.archiveChannel = async function(id) {
  closeChMenu();
  const { hubConfirm } = await import("/hub-sdk.js");
  const ok = await hubConfirm({
    message: "Archive this channel?",
    description: "The channel will become read-only and hidden from the default view. This cannot be undone from the app.",
    confirmLabel: "Archive",
    destructive: true,
  });
  if (!ok) return;

  await db(
    `UPDATE channels SET archived_at = ? WHERE id = ? AND household_id = current_setting('app.household_id', true)::uuid`,
    [new Date().toISOString(), id]
  );
  await loadChannels();
  if (currentChannelId === id) currentChannelId = null;
  renderSidebar();
  renderMain();
};

window.unarchiveChannel = async function(id) {
  closeChMenu();
  await db(
    `UPDATE channels SET archived_at = NULL WHERE id = ? AND household_id = current_setting('app.household_id', true)::uuid`,
    [id]
  );
  await loadChannels();
  renderSidebar();
  renderMain();
};

// ── Search ─────────────────────────────────────────────────────────────────────
let searchDebounce = null;
document.getElementById("search-input").addEventListener("input", e => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => {
    searchQuery = e.target.value.trim();
    renderMain();
  }, 300);
});

// ── Modal ─────────────────────────────────────────────────────────────────────
function openModal(html) {
  closeModal();
  modalEl = document.createElement("div");
  modalEl.className = "modal-backdrop";
  modalEl.innerHTML = `<div class="modal">${html}</div>`;
  modalEl.addEventListener("click", e => { if (e.target === modalEl) closeModal(); });
  document.body.appendChild(modalEl);
}
window.closeModal = function() { modalEl?.remove(); modalEl = null; };

// ── New channel button ────────────────────────────────────────────────────────
document.getElementById("new-channel-btn").addEventListener("click", () => window.openNewChannel());

// ── Deep link ─────────────────────────────────────────────────────────────────
function handleDeepLink() {
  const params = new URLSearchParams(window.location.search);
  const channelId = params.get("channelId");
  if (channelId) window.openChannel(channelId);
}

// ── Bootstrap ─────────────────────────────────────────────────────────────────
(async () => {
  await Promise.all([loadMembers(), loadChannels(), loadSubscriptions(), loadLastRead()]);
  renderSidebar();
  handleDeepLink();
  if (!currentChannelId) renderMain();
})();
</script>
